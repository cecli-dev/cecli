name: Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  linux:
    name: Linux packages (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        run: |
          bash .github/scripts/apt-install.sh \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev zlib1g-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # RPM rejects "-" in Version; keep the prerelease in Release.
          RPM_VERSION="$VERSION"
          RPM_RELEASE="1"

          if [[ "$VERSION" == *-* ]]; then
            RPM_VERSION="${VERSION%%-*}"
            RPM_PRERELEASE="${VERSION#*-}"

            if [[ "$RPM_PRERELEASE" == post* ]]; then
              RPM_RELEASE="1.${RPM_PRERELEASE}"
            else
              RPM_RELEASE="0.${RPM_PRERELEASE}"
            fi

            RPM_RELEASE="${RPM_RELEASE//-/.}"
          fi

          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json
          printf '{"version":"%s","bundle":{"linux":{"rpm":{"release":"%s"}}}}\n' \
            "$RPM_VERSION" "$RPM_RELEASE" > desktop/src-tauri/tauri.rpm.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python3 desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-x86_64-unknown-linux-gnu

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build AppImage and deb
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles appimage,deb

      - name: Build rpm
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --config src-tauri/tauri.rpm.version.conf.json \
            --bundles rpm

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-linux-x64-appimage
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-linux-x64-deb
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-linux-x64-rpm
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/rpm/*.rpm

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-x86_64-pc-windows-msvc.exe

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        shell: bash
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles nsis

      - name: Verify installer version matches tag
        shell: bash
        working-directory: desktop
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          case "$installer" in
            *"_${CECLI_APP_VERSION}_"*) ;;
            *)
              echo "::error::installer '$installer' does not match CECLI_APP_VERSION=${CECLI_APP_VERSION}"
              exit 1
              ;;
          esac
          echo "Installer version matches ${CECLI_APP_VERSION}: $installer"

      - name: Upload unsigned installer for signing
        if: startsWith(github.ref, 'refs/tags/')
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: signpath-input-windows
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          archive: false

      - name: Sign installer with SignPath
        if: startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: true
          parameters: |
            version: "${{ env.CECLI_APP_VERSION }}"

      - name: Upload signed installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-windows-x64
          if-no-files-found: error
          path: signed/*.exe

      - name: Upload unsigned installer (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-windows-x64
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python3 desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-aarch64-apple-darwin

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build dmg
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-macos-arm64
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Detect prerelease channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ce-underscore-*
          merge-multiple: true

      - name: Rename desktop artifacts for release
        shell: bash
        run: |
          cd artifacts
          for file in cecli_*; do
            if [ -e "$file" ]; then
              mv "$file" "ce-underscore_${file#cecli_}"
            fi
          done
          for file in cecli-*.rpm; do
            if [ -e "$file" ]; then
              mv "$file" "ce-underscore-${file#cecli-}"
            fi
          done

      - name: Create stable desktop download names
        shell: bash
        run: |
          cd artifacts
          win=$(ls ce-underscore_*_x64-setup.exe 2>/dev/null | head -1)
          mac=$(ls ce-underscore_*_aarch64.dmg 2>/dev/null | head -1)
          appimage=$(ls ce-underscore_*_amd64.AppImage 2>/dev/null | head -1)
          deb=$(ls ce-underscore_*_amd64.deb 2>/dev/null | head -1)
          rpm=$(ls ce-underscore-*x86_64.rpm 2>/dev/null | head -1)
          if [ -n "$win" ]; then cp "$win" ce-underscore-windows-x64-setup.exe; fi
          if [ -n "$mac" ]; then cp "$mac" ce-underscore-macos-arm64.dmg; fi
          if [ -n "$appimage" ]; then cp "$appimage" ce-underscore-linux-x64.AppImage; fi
          if [ -n "$deb" ]; then cp "$deb" ce-underscore-linux-x64.deb; fi
          if [ -n "$rpm" ]; then cp "$rpm" ce-underscore-linux-x64.rpm; fi
          for file in \
            ce-underscore-windows-x64-setup.exe \
            ce-underscore-macos-arm64.dmg \
            ce-underscore-linux-x64.AppImage \
            ce-underscore-linux-x64.deb \
            ce-underscore-linux-x64.rpm; do
            if [ ! -f "$file" ]; then
              echo "::error::missing stable download name: $file"
              exit 1
            fi
          done
          ls -l ce-underscore-*

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
