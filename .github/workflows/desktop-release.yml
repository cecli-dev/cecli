name: Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  linux:
    name: Linux AppImage (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        run: |
          bash .github/scripts/apt-install.sh \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev zlib1g-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python3 desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-x86_64-unknown-linux-gnu

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build AppImage and deb
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles appimage,deb

      - uses: actions/upload-artifact@v4
        with:
          name: cecli-desktop-linux-x64
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-x86_64-pc-windows-msvc.exe

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        shell: bash
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: cecli-desktop-windows-x64
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python3 desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-aarch64-apple-darwin

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build dmg
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: cecli-desktop-macos-arm64
          if-no-files-found: error
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Detect prerelease channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
