name: Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Detect prerelease channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            **Code signing policy:** Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). See the [code signing policy](https://github.com/cecli-dev/cecli/blob/main/CODE_SIGNING_POLICY.md) for signing scope and team roles.

  linux:
    name: Linux packages (x64)
    needs: create-release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        run: |
          bash .github/scripts/apt-install.sh \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev zlib1g-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint the app-harness bridge
        run: cargo clippy -p ce-app-bridge --all-targets -- -D warnings

      - name: Test the app-harness bridge
        run: cargo test -p ce-app-bridge

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # RPM rejects "-" in Version; keep the prerelease in Release.
          RPM_VERSION="$VERSION"
          RPM_RELEASE="1"

          if [[ "$VERSION" == *-* ]]; then
            RPM_VERSION="${VERSION%%-*}"
            RPM_PRERELEASE="${VERSION#*-}"

            if [[ "$RPM_PRERELEASE" == post* ]]; then
              RPM_RELEASE="1.${RPM_PRERELEASE}"
            else
              RPM_RELEASE="0.${RPM_PRERELEASE}"
            fi

            RPM_RELEASE="${RPM_RELEASE//-/.}"
          fi

          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json
          printf '{"version":"%s","bundle":{"linux":{"rpm":{"release":"%s"}}}}\n' \
            "$RPM_VERSION" "$RPM_RELEASE" > desktop/src-tauri/tauri.rpm.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python3 desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-x86_64-unknown-linux-gnu

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build AppImage and deb
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles appimage,deb

      - name: Build rpm
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --config src-tauri/tauri.rpm.version.conf.json \
            --bundles rpm

      - name: Verify Linux packages expose ce-underscore
        shell: bash
        run: bash desktop/scripts/check_linux_bundle.sh target/release/bundle

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-linux-x64-appimage
          if-no-files-found: error
          path: target/release/bundle/appimage/*.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-linux-x64-deb
          if-no-files-found: error
          path: target/release/bundle/deb/*.deb

      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-linux-x64-rpm
          if-no-files-found: error
          path: target/release/bundle/rpm/*.rpm

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          bundle_dir=target/release/bundle
          mkdir -p release-assets
          for file in "$bundle_dir"/appimage/*.AppImage "$bundle_dir"/deb/*.deb "$bundle_dir"/rpm/*.rpm; do
            name=$(basename "$file")
            name=${name//cecli_/ce-underscore_}
            name=${name//cecli-/ce-underscore-}
            cp "$file" "release-assets/$name"
          done
          cp "$bundle_dir"/appimage/*.AppImage release-assets/ce-underscore-linux-x64.AppImage
          cp "$bundle_dir"/deb/*.deb release-assets/ce-underscore-linux-x64.deb
          cp "$bundle_dir"/rpm/*.rpm release-assets/ce-underscore-linux-x64.rpm
          ls -l release-assets

      - name: Publish to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*

  windows:
    name: Windows (x64)
    needs: create-release
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    env:
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Test the app-harness bridge
        shell: bash
        run: cargo test -p ce-app-bridge

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-x86_64-pc-windows-msvc.exe

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build app executable
        shell: bash
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --no-bundle

      - name: Upload unsigned app for signing
        if: startsWith(github.ref, 'refs/tags/')
        id: upload-unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: signpath-input-windows-app
          if-no-files-found: error
          path: target/release/ce-underscore.exe

      - name: Sign app executable with SignPath
        if: startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
          skip-decompress: false
          parameters: |
            version: "${{ env.CECLI_APP_VERSION }}"

      - name: Verify signed app executable
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed-app/*.exe | Select-Object -First 1
          if (-not $exe) { throw "SignPath did not return a signed executable" }

          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -in @('NotSigned', 'HashMismatch')) { throw "Signed app status: $($sig.Status)" }

          if ($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'release-signing' -and $sig.Status -ne 'Valid') {
            throw "Signed app status: $($sig.Status)"
          }

          if ($env:SIGNPATH_SIGNING_POLICY_SLUG -ne 'release-signing') {
            Write-Output "Policy $($env:SIGNPATH_SIGNING_POLICY_SLUG): signature status $($sig.Status); certificate trust is not enforced"
          }

          Write-Output "Signed app: $($exe.Name) / $($sig.SignerCertificate.Subject)"

      - name: Replace app executable with signed build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cp signed-app/ce-underscore.exe target/release/ce-underscore.exe

      - name: Build NSIS installer
        shell: bash
        working-directory: desktop
        run: |
          npm run tauri bundle -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles nsis

      - name: Verify installer version matches tag
        shell: bash
        working-directory: desktop
        run: |
          installer=$(ls ../target/release/bundle/nsis/*.exe | head -1)
          case "$installer" in
            *"_${CECLI_APP_VERSION}_"*) ;;
            *)
              echo "::error::installer '$installer' does not match CECLI_APP_VERSION=${CECLI_APP_VERSION}"
              exit 1
              ;;
          esac
          echo "Installer version matches ${CECLI_APP_VERSION}: $installer"

      - name: Upload unsigned installer for signing
        if: startsWith(github.ref, 'refs/tags/')
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: signpath-input-windows
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

      - name: Sign installer with SignPath
        if: startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          # Installer configuration is the project default ("Initial version", slug: initial)
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: false
          parameters: |
            version: "${{ env.CECLI_APP_VERSION }}"

      - name: Upload signed installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-windows-x64
          if-no-files-found: error
          path: signed/*.exe

      - name: Upload unsigned installer (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-windows-x64
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release-assets

          echo "Windows signing policy: ${SIGNPATH_SIGNING_POLICY_SLUG}"
          installer=$(ls signed/*.exe | head -1)

          name=$(basename "$installer")
          name=${name//cecli_/ce-underscore_}
          cp "$installer" "release-assets/$name"
          cp "$installer" release-assets/ce-underscore-windows-x64-setup.exe
          ls -l release-assets

      - name: Publish to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*

  macos-arm64:
    name: macOS (arm64)
    needs: create-release
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Test the app-harness bridge
        shell: bash
        run: cargo test -p ce-app-bridge

      - name: Resolve runtime spec and app version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"
            echo "CECLI_RUNTIME_SPEC=cecli-dev==$RELEASE" >> "$GITHUB_ENV"
          else
            RELEASE=""
            echo "CECLI_RUNTIME_SPEC=cecli-dev" >> "$GITHUB_ENV"
          fi

          VERSION="${RELEASE:-0.1.0}"
          VERSION="${VERSION/.dev/-dev}"
          VERSION="${VERSION/.post/-post}"
          if [[ "$VERSION" =~ ^(.*[0-9])((a|b|rc)[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          fi

          echo "CECLI_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}\n' "$VERSION" > desktop/src-tauri/tauri.version.conf.json

      - name: Stage uv sidecar
        shell: bash
        run: python3 desktop/scripts/fetch_uv.py

      - name: Verify runtime spec resolves
        uses: ./.github/actions/wait-for-pypi
        with:
          spec: ${{ env.CECLI_RUNTIME_SPEC }}
          uv: desktop/src-tauri/binaries/uv-aarch64-apple-darwin

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Build dmg
        working-directory: desktop
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ce-underscore-macos-arm64
          if-no-files-found: error
          path: target/release/bundle/dmg/*.dmg

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release-assets
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          name=$(basename "$dmg")
          name=${name//cecli_/ce-underscore_}
          cp "$dmg" "release-assets/$name"
          cp "$dmg" release-assets/ce-underscore-macos-arm64.dmg
          ls -l release-assets

      - name: Publish to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*
