    try {
      const stored = window.__CECLI_THEME__ || localStorage.getItem('cecli.theme');
      const dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.body.classList.add('dark');
    } catch (error) {
