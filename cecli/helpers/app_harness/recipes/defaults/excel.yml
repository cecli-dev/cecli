key: excel
display_name: Microsoft Excel
description: Drive Excel's Name Box, formula bar, grid, and sheet tabs.
process_names:
  - excel.exe
  - excel
  - excel32.exe
title_markers:
  - excel
aliases:
  - ms-excel
  - msexcel
  - microsoft excel
selectors:
  name_box: 'edit[name="Name Box"], combo_box[name="Name Box"]'
  formula_bar: 'edit[name="Formula Bar"], edit[name*="Formula Bar"]'
  text_entry: 'edit[name="Formula Bar"], edit[name*="Formula Bar"]'
  sheet_tabs: tab_item
  grid: table
  editing_probe: 'text[name="Cell Mode Edit"], button[name="Cancel"], button[name="Enter"]'
  goto_edit: 'edit[name*="Reference"]'
  dialog_ok: 'button[name="OK"]'
  dialog_cancel: 'button[name="Cancel"]'
keys:
  edit_cell: '{F2}'
  cancel_edit: '{ESC}'
  commit: '{ENTER}'
  paste: '^v'
  paste_special: '^+v'
  copy: '^c'
  select_all: '^a'
  goto: '^g'
  delete: '{DELETE}'
sections:
  Cell read/write:
    - Read with client.cell_at(window, row, column, grid) and use its value.
    - Write by pasting from the clipboard after selecting the cell through
    - the Name Box; keystrokes make Excel autocorrect formulas and can leave
    - the cell in edit mode. An empty value clears the cell with Delete.
    - A leading '=' is stored as a formula; prefix a literal apostrophe when
    - the text must stay a string. An empty cell may report its own
    - address; treat that value as an empty string.
  Name box and goto:
    - The Name Box accepts a cell, a range, or a defined name. Set its value,
    - then send {ENTER} to move the selection.
    - Ctrl+G opens the Go To dialog; the reference edit control is named
    - like 'Reference:' and the dialog is a separate top-level window.
  Range selection:
    - Type 'A1:C3' (or 'A:C', '1:3') into the Name Box and press {ENTER} to
    - select the range without dragging. The active cell is the top-left.
  TSV paste:
    - Put tab-separated rows on the clipboard, select the anchor cell, then
    - send ^v. Excel expands the paste to fit the tab and newline structure.
    - Quote fields containing tabs, newlines or double quotes and double the
    - inner quotes so the grid keeps them in one cell. A Paste Options
    - overlay can appear after ^v; Escape dismisses it.
  Sheet tabs:
    - Sheet tabs are tab_item controls named after the sheet. Invoke or
    - select them; the tab strip itself may be offscreen when the window is
    - narrow, so use Ctrl+PageDown as a fallback navigation.
  Dialogs:
    - 'Native dialogs use class #32770 and live in separate top-level windows.'
    - Enumerate client.dialogs() before sending keys; buttons are named OK,
    - Cancel, Yes, No.
  Text entry:
    - For non-grid fields, prefer set_value on the named edit control.
    - When only keystrokes work, type_text escapes SendKeys metacharacters
    - and edit_text falls back to clipboard paste.
gotchas:
  - Excel may show a Paste Options overlay after Ctrl+V; press ESC to dismiss
  - it before clicking another control.
  - Typing into a cell while a dialog is open is blocked; check dialogs first.
  - Bulk cell_at reads are slow and each call re-walks the grid; use one TSV
  - paste for large writes and read ranges in modest blocks.
  - The Name Box only accepts English A1 notation; R1C1 mode is ignored for
  - the typed reference and may select the wrong cell.
  - An in-cell edit is not committed until Enter. A following cell_at may
  - read the old value while the editor is still open.
