key: libreoffice
display_name: LibreOffice Calc
description: Drive Calc's Name Box, input line, grid, and sheet tabs.
process_names:
  - soffice.bin
  - soffice.exe
  - soffice
  - scalc.bin
  - scalc
  - libreoffice
  - libreoffice.bin
title_markers:
  - libreoffice calc
  - libreoffice
aliases:
  - lo
  - calc
  - libre-office
  - soffice
  - scalc
  - libreoffice calc
selectors:
  name_box: 'combo_box[name="Name Box"], edit[name="Name Box"]'
  formula_bar: 'edit[name="Input line"], edit[name="Formula Bar"], text[name="Input line"]'
  text_entry: 'edit[name="Input line"], edit[name="Formula Bar"]'
  sheet_tabs: page_tab
  grid: table
  editing_probe: 'button[name="Cancel"], button[name="Apply"], push_button[name="Cancel"], push_button[name="Apply"]'
  goto_edit: 'edit[name*="Reference"]'
  dialog_ok: 'push_button[name="OK"], button[name="OK"]'
  dialog_cancel: 'push_button[name="Cancel"], button[name="Cancel"]'
keys:
  edit_cell: '{F2}'
  cancel_edit: '{ESC}'
  commit: '{ENTER}'
  paste: '^v'
  paste_special: '^+v'
  copy: '^c'
  select_all: '^a'
  goto: '^g'
  delete: '{DELETE}'
sections:
  Cell read/write:
    - Read with client.cell_at(window, row, column, grid); Calc exposes the
    - cell value through AT-SPI after an edit is committed.
    - Paste from the clipboard after selecting the cell through the Name
    - Box; mouse or keyboard entry can leave Calc in edit mode.
    - A leading '=' is a formula; use a leading apostrophe for literal text.
    - A grid larger than 5000 cells defeats the AT-SPI collection read, so
    - use reference-based reads on very large sheets.
  Name box and goto:
    - The Name Box is a combo_box named 'Name Box'. Set its value and send
    - '{ENTER}; both single cells and ranges are accepted.'
    - Ctrl+G opens the Navigator; it is not a reliable goto substitute, so
    - prefer the Name Box.
  Range selection:
    - Type 'A1:C3' into the Name Box and press {ENTER}. Whole columns and
    - rows ('A:C', '1:3') are also accepted.
  TSV paste:
    - Put tab-separated rows on the clipboard, select the anchor cell, then
    - send ^v. Calc may open a Text Import dialog for multi-line data; accept
    - it with the default tab separator before reading cells back.
    - Use ^+v when a paste-special dialog is wanted instead of plain paste.
  Sheet tabs:
    - Sheet tabs are page_tab controls named after the sheet. Select a tab
    - to activate it; Ctrl+PageDown cycles sheets when the tab strip is
    - offscreen.
  Dialogs:
    - Dialogs are separate top-level windows with role dialog. Buttons are
    - push_button controls named OK, Cancel, Yes, No.
    - The Text Import dialog is the most common blocker after a TSV paste.
  Text entry:
    - Prefer set_value on the named edit control. When the bridge refuses a
    - value write, use type_text; edit_text falls back to clipboard paste.
gotchas:
  - A multi-line clipboard paste can raise the Text Import dialog, which
  - blocks input until dismissed or accepted; call dialogs() afterwards.
  - Calc only exposes a committed cell value; press Enter or ESC before
  - reading a cell that was just edited.
  - Sheet tab names may be truncated in a narrow window; match by exact name
  - from sheet_names() rather than by a visible prefix.
  - The Name Box rejects sheet-local references with spaces unless the sheet
  - name is quoted, e.g. 'My Sheet'!A1.
  - Frame/role names differ slightly across LibreOffice versions; if a
  - selector misses, snapshot the window and prefer role plus visible name.
